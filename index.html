<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3182F6">
<title>자산 로드맵</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#F3F6F8; --surface:#FFFFFF; --surface2:#EAF0F3;
  --ink:#16323F; --ink2:#4F6B78; --ink3:#8AA2AD;
  --line:#DDE6EA; --line2:#EEF3F5;
  --accent:#0E8F93; --accent-soft:#E2F2F1;
  --up:#1E8E5A; --down:#D2554A; --amber:#D99A2B;
  --radius:14px;
  --sans:'Pretendard','Apple SD Gothic Neo','Noto Sans KR',system-ui,sans-serif;
  --serif:'Gowun Batang','Apple SD Gothic Neo',serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  font-feature-settings:"tnum"; -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
}
#app{max-width:470px;margin:0 auto;padding:18px 16px 56px}
button,input,textarea,select{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.hero{margin-bottom:16px}
.hero .eyebrow{font-family:var(--serif);font-size:13px;color:var(--accent);letter-spacing:.03em}
.hero .big{font-family:var(--serif);font-size:33px;line-height:1.15;margin-top:3px;letter-spacing:-.01em}
.hero .big small{font-size:15px;color:var(--ink2);font-family:var(--sans);margin-left:3px}
.hero .sub{font-size:12.5px;color:var(--ink2);margin-top:5px;line-height:1.6}

.tabs{display:flex;gap:4px;background:var(--surface2);padding:4px;border-radius:11px;margin-bottom:18px}
.tabs button{flex:1;border:none;background:transparent;padding:8px 2px;border-radius:8px;font-size:13px;color:var(--ink2);transition:background .15s,color .15s}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(22,50,63,.08)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.card.flat{background:transparent;border:none;padding:0}
.lbl{font-size:11.5px;color:var(--ink3);margin-bottom:5px;letter-spacing:.01em}
.sec{font-size:13.5px;color:var(--ink2);margin:22px 0 9px;font-weight:600}
.rowline{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--ink2);font-size:12.5px;line-height:1.7}
.faint{color:var(--ink3);font-size:11.5px;line-height:1.65}
.num{font-family:var(--serif)}

.btn{border:none;border-radius:9px;padding:11px 16px;font-size:14px;font-weight:600;background:var(--accent);color:#fff}
.btn:disabled{opacity:.4}
.btn.ghost{background:var(--surface);color:var(--ink2);border:1px solid var(--line);font-weight:500}
.btn.tiny{padding:6px 11px;font-size:12.5px;font-weight:500;border-radius:7px}
.btn.full{width:100%}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}

input[type=text],input[type=number],input[type=password],input[type=date],textarea,select{
  width:100%;background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:9px 11px;font-size:14.5px;outline:none;transition:border-color .15s}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:none;line-height:1.7;font-size:13.5px}
.amt{text-align:right;font-feature-settings:"tnum"}
.field{margin-bottom:11px}
.grid2{display:flex;gap:10px}
.grid2>*{flex:1;min-width:0}

.acc{width:100%;display:flex;justify-content:space-between;align-items:center;background:transparent;border:none;border-top:1px solid var(--line2);padding:12px 0;font-size:14px}
.acc .tag{color:var(--ink2);display:flex;align-items:center;gap:6px}
.acc .chev{color:var(--ink3);font-size:12px}
.accbody{padding:0 0 12px;font-size:12.5px;color:var(--ink2);line-height:1.95}
.accbody .rowline{margin-bottom:2px}

.bar{height:7px;background:var(--surface2);border-radius:4px;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--accent)}

.entry{display:flex;align-items:baseline;gap:8px;padding:9px 0;border-bottom:1px solid var(--line2)}
.entry .cat{font-size:11px;color:var(--ink3);flex:0 0 62px}
.entry .nm{flex:1;min-width:0;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.entry .val{font-size:14px}
.entry .del{background:none;border:none;color:var(--line);font-size:16px;padding:0 2px}
.entry .del:hover{color:var(--down)}
.chip{font-size:10.5px;padding:1px 5px;border-radius:5px;margin-left:5px;vertical-align:middle}
.chip.p{background:#FDF2DC;color:#8A6112}
.chip.r{background:#E3F3EA;color:#1E6B47}
.chip.s{background:#FBF1DC;color:#7A6020}

.daterow{font-size:12px;color:var(--ink2);padding-bottom:6px;border-bottom:1px solid var(--line);margin-top:16px}

.legend{display:flex;align-items:center;gap:7px;font-size:12.5px;margin-bottom:5px}
.legend i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.legend .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend .pc{color:var(--ink2)}
.piewrap{display:flex;gap:16px;align-items:center}

.note{border-radius:10px;padding:11px 13px;font-size:12.5px;line-height:1.7;margin-bottom:13px}
.note.warn{background:#FDF4E3;color:#8A6112;border:1px solid #F0DFBC}
.note.info{background:var(--accent-soft);color:#0B6B6E;border:1px solid #C9E6E5}
.note.err{background:#FBECEA;color:#96382E;border:1px solid #F2D2CD}

.prose{font-size:13.5px;line-height:1.9;white-space:pre-wrap}
.pend{display:flex;gap:7px;align-items:center;margin-bottom:8px}
.pend select{flex:0 0 96px;padding:6px 5px;font-size:12px;border-radius:7px}
.pend .it{flex:1;min-width:0;padding:7px 8px;font-size:13px;border-radius:7px}
.pend .am{flex:0 0 82px;padding:7px 8px;font-size:13px;border-radius:7px}
.toggle{flex:0 0 auto;font-size:11px;padding:6px 7px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--ink3)}
.toggle[aria-pressed="true"]{border-color:var(--amber);color:#8A6112;background:#FDF2DC}

.spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}
.hr{height:1px;background:var(--line);margin:18px 0}

/* 2026 UI refresh — Toss-inspired, readable and calm */
:root{
  --bg:#F4F7FB; --surface:#FFFFFF; --surface2:#EEF3F8;
  --ink:#191F28; --ink2:#4E5968; --ink3:#8B95A1;
  --line:#E5E8EB; --line2:#F2F4F6;
  --accent:#3182F6; --accent-soft:#EAF3FF;
  --up:#00A76F; --down:#F04452; --amber:#F59F00;
  --radius:20px;
}
body{background:linear-gradient(180deg,#F7F9FC 0,#F2F5F9 420px,#F4F7FB 100%)}
#app{max-width:520px;padding:20px 16px 72px}
.hero{margin-bottom:14px}
.hero-card{position:relative;overflow:hidden;min-height:148px;padding:23px 22px;border-radius:26px;background:linear-gradient(135deg,#1769E0 0%,#3182F6 58%,#72A9FF 100%);color:#fff;box-shadow:0 16px 36px rgba(49,130,246,.22)}
.hero-card:before{content:"";position:absolute;width:170px;height:170px;border-radius:50%;right:-74px;top:-85px;background:rgba(255,255,255,.13)}
.hero-copy{position:relative;z-index:1;max-width:72%}
.hero .eyebrow{font-family:var(--sans);font-size:12px;font-weight:700;color:rgba(255,255,255,.78);letter-spacing:.02em}
.hero .big{font-family:var(--sans);font-size:32px;font-weight:800;line-height:1.15;letter-spacing:-.035em;margin-top:7px}
.hero .big small{font-size:15px;color:rgba(255,255,255,.86);font-family:var(--sans);font-weight:600}
.hero .sub{font-size:12.5px;color:rgba(255,255,255,.78);margin-top:8px;line-height:1.5}
.mascot{position:absolute;right:17px;bottom:12px;width:105px;height:105px;filter:drop-shadow(0 9px 10px rgba(19,72,151,.2));animation:floaty 3.4s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-5px) rotate(1deg)}}
.tabs{position:relative;gap:3px;background:rgba(238,243,248,.9);backdrop-filter:blur(12px);padding:5px;border-radius:16px;margin:14px 0 20px;box-shadow:0 4px 18px rgba(25,31,40,.06)}
.main-tabs{position:sticky;top:8px;z-index:10}
.tabs button{padding:9px 2px;border-radius:11px;font-size:12.5px;font-weight:600;color:var(--ink2)}
.tabs button[aria-selected="true"]{color:var(--accent);font-weight:800;box-shadow:0 2px 8px rgba(49,130,246,.12)}
.card{border:0;border-radius:var(--radius);padding:18px;margin-bottom:13px;box-shadow:0 5px 20px rgba(25,31,40,.055)}
.lbl{font-size:12px;color:var(--ink3);font-weight:600}
.sec{font-size:17px;color:var(--ink);margin:27px 2px 12px;font-weight:800;letter-spacing:-.02em}
.num{font-family:var(--sans);font-weight:750;letter-spacing:-.025em}
.btn{border-radius:13px;padding:12px 17px;font-weight:750;box-shadow:0 4px 12px rgba(49,130,246,.16)}
.btn.ghost{background:#F2F4F6;border:0;color:var(--ink2);box-shadow:none;font-weight:650}
.btn.tiny{border-radius:10px}
input[type=text],input[type=number],input[type=password],input[type=date],textarea,select{background:#F7F9FA;border:1px solid transparent;border-radius:13px;padding:11px 12px;transition:border-color .15s,box-shadow .15s,background .15s}
input:focus,textarea:focus,select:focus{background:#fff;border-color:#9CC4FA;box-shadow:0 0 0 3px rgba(49,130,246,.1)}
.note{border:0;border-radius:14px}
.note.info{background:var(--accent-soft);color:#1B64C8}
.bar{height:8px;background:#E9EEF4}
.bar>i{background:linear-gradient(90deg,#3182F6,#6FA8FF)}
.entry{align-items:center;gap:10px;padding:12px 3px;border-bottom:1px solid var(--line2)}
.entry:last-child{border-bottom:0}
.entry .cat{flex:0 0 auto;min-width:54px;width:auto;padding:5px 8px;border-radius:9px;background:#F2F4F6;color:var(--ink2);font-size:10.5px;font-weight:700;text-align:center}
.entry .nm{font-size:14px;font-weight:600}
.entry .val{font-size:14px;font-weight:750;white-space:nowrap}
.entry.income .cat{background:#E8F8F2;color:#008A5A}
.entry.expense .cat{background:#FFF0F1;color:#D83B49}
.daterow{font-weight:700;color:var(--ink2);padding:16px 2px 7px;border-bottom:0;margin-top:0}
.record-intro{display:flex;align-items:center;gap:13px;margin-bottom:12px;padding:4px 3px}
.mini-mascot{flex:0 0 54px;width:54px;height:54px}
.record-intro strong{display:block;font-size:17px;letter-spacing:-.02em;margin-bottom:3px}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:17px 0}
.summary-card{background:#fff;border-radius:18px;padding:15px;box-shadow:0 5px 20px rgba(25,31,40,.05)}
.summary-card .amount{margin-top:5px;font-size:18px;font-weight:800;letter-spacing:-.03em}
.flow-switch{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:5px;background:#E9EEF4;border-radius:15px;margin:19px 0 8px}
.flow-switch button{border:0;background:transparent;padding:11px;border-radius:11px;color:var(--ink2);font-size:14px;font-weight:700}
.flow-switch button[aria-selected="true"]{background:#fff;color:var(--accent);box-shadow:0 2px 8px rgba(25,31,40,.08)}
.weekgroup,.estate-fold{background:#fff;border:0;border-radius:18px;margin:10px 0;box-shadow:0 4px 16px rgba(25,31,40,.045);overflow:hidden}
.weekgroup>summary,.estate-fold>summary{list-style:none;cursor:pointer;padding:16px 17px;font-weight:750;display:flex;align-items:center;justify-content:space-between;gap:10px}
.weekgroup>summary::-webkit-details-marker,.estate-fold>summary::-webkit-details-marker{display:none}
.weekgroup>summary:after,.estate-fold>summary:after{content:"";flex:0 0 auto;width:7px;height:7px;border-right:2px solid var(--ink3);border-bottom:2px solid var(--ink3);transform:translateY(-2px) rotate(45deg);transition:transform .18s}
.weekgroup[open]>summary:after,.estate-fold[open]>summary:after{transform:translateY(2px) rotate(225deg)}
.weekbody{padding:0 16px 10px;border-top:1px solid var(--line2)}
.weekmeta{color:var(--ink3);font-size:11.5px;font-weight:600;margin-left:auto}
.empty-state{text-align:center;padding:28px 14px;color:var(--ink3);font-size:13px;line-height:1.7}
.estate-body{padding:0 17px 17px;border-top:1px solid var(--line2)}
.asset-kicker{display:flex;align-items:flex-end;justify-content:space-between;margin:3px 2px 13px}
.asset-kicker strong{font-size:20px;letter-spacing:-.03em}
.asset-kicker span{font-size:13px;color:var(--ink2)}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.quick-btn{border:0;border-radius:17px;padding:15px 12px;background:#fff;box-shadow:0 5px 18px rgba(25,31,40,.055);font-size:14px;font-weight:800;text-align:left}
.quick-btn b{display:block;font-size:21px;margin-bottom:5px}
.quick-btn.expense b{color:var(--down)}.quick-btn.income b{color:var(--up)}
.more-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.more-card{border:0;background:#fff;border-radius:20px;padding:18px;text-align:left;min-height:120px;box-shadow:0 5px 20px rgba(25,31,40,.055)}
.more-card .ico{display:grid;place-items:center;width:38px;height:38px;border-radius:13px;background:var(--accent-soft);font-size:20px;margin-bottom:18px}
.more-card strong{display:block;font-size:16px;margin-bottom:5px}.more-card span{font-size:12px;color:var(--ink3);line-height:1.5}
.subpage-head{display:flex;align-items:center;gap:10px;margin:0 2px 17px}
.subpage-head button{border:0;background:#fff;width:34px;height:34px;border-radius:11px;font-size:18px;box-shadow:0 3px 10px rgba(25,31,40,.06)}
.subpage-head strong{font-size:20px;letter-spacing:-.03em}
.asset-view{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 2px;border-top:1px solid var(--line2);font-size:13px}
.asset-view:first-of-type{border-top:0}.asset-view .meta{color:var(--ink3);font-size:11.5px;margin-top:3px}
.edit-pill{border:0;background:var(--accent-soft);color:var(--accent);border-radius:11px;padding:8px 12px;font-weight:750;font-size:12.5px}
.analysis-hero{background:linear-gradient(135deg,#152A4A,#244F86);color:#fff;border-radius:22px;padding:19px;margin-bottom:14px;box-shadow:0 12px 25px rgba(21,42,74,.16)}
.analysis-hero .lbl{color:rgba(255,255,255,.68)}
.analysis-hero .amount{font-size:26px;font-weight:850;margin-top:5px;letter-spacing:-.035em}
.sync-strip{display:flex;align-items:center;justify-content:center;gap:7px;margin:-8px 0 17px;color:var(--ink3);font-size:11.5px;font-weight:650}
.sync-dot{width:7px;height:7px;border-radius:50%;background:#AAB2BD;box-shadow:0 0 0 3px rgba(170,178,189,.13)}
.sync-dot.ok{background:var(--up);box-shadow:0 0 0 3px rgba(0,167,111,.12)}
.sync-dot.work{background:var(--amber);animation:pulse 1s ease-in-out infinite}.sync-dot.bad{background:var(--down)}
@keyframes pulse{50%{opacity:.35}}
.budget-card{background:linear-gradient(145deg,#FFFFFF,#F4F8FF);border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 7px 22px rgba(49,130,246,.08)}
.budget-top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:12px}
.budget-remaining{font-size:23px;font-weight:850;letter-spacing:-.035em}
.budget-row{margin-top:12px}.budget-row .rowline{font-size:12px;margin-bottom:5px}
.budget-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:10px}
.budget-input{background:#fff;border-radius:14px;padding:10px}
.budget-input .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.budget-input input{margin-top:4px;text-align:right;padding:8px 9px}
.trend-card{background:#fff;border-radius:22px;padding:18px;margin:14px 0;box-shadow:0 6px 20px rgba(25,31,40,.05)}
.coin{animation:coinDrop 3.6s ease-in infinite}
@keyframes coinDrop{0%,55%{transform:translateY(0);opacity:1}78%{transform:translateY(20px);opacity:1}86%,100%{transform:translateY(22px);opacity:0}}
/* 홈이 아닌 탭에서는 순자산 카드를 한 줄 크기로 줄여 입력칸이 바로 보이게 한다 */
.hero-card.compact{min-height:0;padding:15px 20px;border-radius:20px;box-shadow:0 8px 20px rgba(49,130,246,.16)}
.hero-card.compact:before{width:110px;height:110px;right:-46px;top:-58px}
.hero-card.compact .big{font-size:23px;margin-top:3px}
.hero-card.compact .sub{display:none}
.hero-card.compact .mascot{width:58px;height:58px;right:14px;bottom:4px}
.pf-total{font-size:26px;font-weight:850;letter-spacing:-.035em;margin-top:4px}
.pf-total small{font-size:14px;color:var(--ink2);font-weight:600;margin-left:2px}
.pf-pl{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:5px;font-size:14px;font-weight:750}
.acct-bar{display:flex;gap:2px;height:10px;margin:16px 0 6px;border-radius:5px;overflow:hidden}
.acct-bar i{display:block;min-width:4px}
.acct-row{width:100%;display:flex;align-items:center;gap:8px;border:0;border-top:1px solid var(--line2);background:transparent;padding:10px 0;font-size:13.5px;text-align:left}
.acct-row:first-of-type{border-top:0}
.acct-row .pc{color:var(--ink3);font-size:12px}
.acct-row b{margin-left:auto;font-weight:750}
.acct-dot{display:inline-block;width:9px;height:9px;border-radius:3px;flex:0 0 auto}
.acct-tabs button{display:flex;align-items:center;justify-content:center;gap:5px}
.acct-chip{font-size:11px;font-weight:750;padding:3px 8px;border-radius:7px;white-space:nowrap}
.stock-card{padding:13px 15px 13px 19px;margin-bottom:8px;box-shadow:inset 4px 0 0 var(--acct),0 5px 20px rgba(25,31,40,.055)}
@media(max-width:380px){.hero-copy{max-width:78%}.mascot{width:88px;height:88px;right:8px}.tabs button{font-size:11.5px}.entry .cat{display:none}}
</style>

<div id="app"><div class="muted" style="padding:30px 0">불러오는 중…</div></div>

<script>
/* ══════════════ 상수 ══════════════ */
const EXP_CATS = ["식비","카페/편의점","술","교통","생활/쇼핑","주거/공과금","건강","취미활동","문화/여가","경조사","기타"];
// 색약 검증을 통과한 8색 범주 팔레트. 9번째부터는 밝은 파랑·회색으로 접는다.
const CAT_COLOR = {"식비":"#2a78d6","카페/편의점":"#eb6834","교통":"#1baf7a","생활/쇼핑":"#eda100","문화/여가":"#e87ba4",
  "건강":"#008300","취미활동":"#4a3aa7","술":"#e34948","주거/공과금":"#86b6ef","경조사":"#c3c2b7","기타":"#898781",
  "수입":"#00A76F","본봉":"#00A76F","부수입":"#eda100"};
const ACCOUNTS=["일반","ISA","연금저축"];
// 세 계좌는 어떤 조합으로 붙어도 색약 기준을 통과하는 파랑·보라·주황.
const ACCOUNT_COLOR={"일반":{c:"#2a78d6",bg:"#EAF2FC"},"ISA":{c:"#4a3aa7",bg:"#EEEBFA"},"연금저축":{c:"#eb6834",bg:"#FDEEE7"}};
const acctColor=a=>ACCOUNT_COLOR[a]||ACCOUNT_COLOR["일반"];
const INC_HINTS = ["월급","급여","입금","받음","받았","수입","월세","강의료","이자","배당","부수입","환급","용돈"];
const SIDE_HINTS = ["부수입","강의료","강의","월세","배당","이자","원고료","자문료","부업"];

/* ══════════════ 유틸 ══════════════ */
const pad=n=>String(n).padStart(2,"0");
const dstr=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>dstr(new Date());
const ym=s=>s.slice(0,7);
const daysAgo=n=>{const d=new Date();d.setDate(d.getDate()-n);return dstr(d)};
function kstNow(){
  const d=new Date();
  return new Date(d.getTime()+(d.getTimezoneOffset()*60000)+(9*3600000));
}
const won=n=>(n==null||isNaN(n))?"-":Math.round(n).toLocaleString("ko-KR");
const uk=n=>{
  if(n==null||isNaN(n)) return "-";
  if(Math.abs(n)>=1e8) return (n/1e8).toFixed(2).replace(/\.?0+$/,"")+"억";
  return Math.round(n/1e4).toLocaleString("ko-KR")+"만";
};
const uid=()=>Math.random().toString(36).slice(2,10);
// 국내 종목코드는 6자리라 앞자리 0이 빠진 숫자는 채워준다 (5930 → 005930).
const normCode=v=>{const s=String(v||"").toUpperCase().replace(/[^0-9A-Z]/g,"").slice(0,6);return /^\d{1,5}$/.test(s)?s.padStart(6,"0"):s;};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=v=>+String(v).replace(/[^\d]/g,"")||0;
function fmtDate(s){const[,m,d]=s.split("-");const wd=["일","월","화","수","목","금","토"][new Date(s).getDay()];return `${+m}.${+d} ${wd}`}
function resolveDate(t){ if(/그저께|그제/.test(t))return daysAgo(2); if(/어제/.test(t))return daysAgo(1); return today(); }

function krAmount(text){
  const s=text.replace(/,/g,""); const re=/(\d+(?:\.\d+)?)\s*(억|만|천)?/g;
  let m,total=0,found=false,lastEnd=-1;
  while((m=re.exec(s))!==null){
    if(found&&m.index>lastEnd)break;
    const v=parseFloat(m[1]),u=m[2];
    total+=v*(u==="억"?1e8:u==="만"?1e4:u==="천"?1e3:1);
    found=true; lastEnd=m.index+m[0].length;
  }
  return found?Math.round(total):null;
}
// AI 키가 없거나 AI 호출이 실패했을 때 쓰는 간단한 규칙 기반 분류.
function localParse(line,forceType){
  const out=[],date=resolveDate(line);
  line.split(/[,\n·/]+| 그리고 /).map(p=>p.trim()).filter(Boolean).forEach(part=>{
    const amount=krAmount(part); if(!amount)return;
    const isInc=forceType?forceType==="income":INC_HINTS.some(w=>part.includes(w));
    const item=part.replace(/\d[\d.,]*\s*(억|만|천)?\s*원?/g,"")
      .replace(/(썼|쓴|샀|사고|결제|지출|입금|받았다|받음|했)\S*/g,"").trim()||(isInc?"수입":"지출");
    const side=isInc&&SIDE_HINTS.some(w=>part.includes(w));
    out.push({id:uid(),date,type:isInc?"income":"expense",amount,cat:isInc?"수입":"기타",item,sideIncome:side});
  });
  return out;
}

function merge(base,inc){
  const o=JSON.parse(JSON.stringify(base));
  if(!inc) return o;
  for(const k of Object.keys(inc)){
    if(inc[k]&&typeof inc[k]==="object"&&!Array.isArray(inc[k])) o[k]={...o[k],...inc[k]};
    else o[k]=inc[k];
  }
  return o;
}

const DEFAULT_CHAIN="gemini-flash-latest,gemini-2.5-flash,gemini-2.5-flash-lite";
function modelChain(){ return (S.settings.modelChain||DEFAULT_CHAIN).split(",").map(s=>s.trim()).filter(Boolean); }
function activeModelIndex(){
  if(S.settings.modelDate!==today()){ S.settings.modelDate=today(); S.settings.modelIndex=0; }
  return S.settings.modelIndex||0;
}
async function callGemini(model,prompt,web){
  const k=(S.settings.apiKey||"").trim();
  const body={ contents:[{role:"user",parts:[{text:prompt}]}],
               generationConfig:{ temperature:0.7, maxOutputTokens:2048 } };
  if(web) body.tools=[{google_search:{}}];
  const url="https://generativelanguage.googleapis.com/v1beta/models/"+encodeURIComponent(model)+":generateContent?key="+encodeURIComponent(k);
  const res=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!res.ok){
    let msg="";
    try{ const j=await res.json(); msg=(j.error&&j.error.message)||""; }catch(_){}
    const e=new Error("api "+res.status);
    e.status=res.status; e.detail=msg;
    throw e;
  }
  const j=await res.json();
  const parts=(j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts)||[];
  const text=parts.map(p=>p.text||"").filter(Boolean).join("\n").trim();
  if(!text) throw new Error("empty response");
  return text;
}
/* OpenAI 호환 FactChat 게이트웨이 호출 */
async function callFactChat(prompt,web){
  const k=(S.settings.factchatKey||"").trim();
  const base=(S.settings.factchatBase||"").trim().replace(/\/$/,"");
  const model=(S.settings.factchatModel||"").trim();
  if(!k||!model){ const e=new Error("nokey"); e.nokey=true; throw e; }
  const sys=web
    ? "너는 실시간 웹 검색 도구가 없을 수 있다. 최신 정보(시세, 뉴스 등)를 확실히 알 수 없다면 추측하지 말고 '실시간 정보를 확인할 수 없다'고 명시한 뒤 알고 있는 범위에서 답하고, 확인이 필요하다는 점을 분명히 밝혀라."
    : "";
  const res=await fetch(base+"/chat/completions",{
    method:"POST",
    headers:{ "Content-Type":"application/json", "Authorization":"Bearer "+k },
    body:JSON.stringify({ model, messages: sys?[{role:"system",content:sys},{role:"user",content:prompt}]:[{role:"user",content:prompt}] })
  });
  if(!res.ok){
    let msg=""; try{ const j=await res.json(); msg=(j.error&&j.error.message)||JSON.stringify(j); }catch(_){}
    const e=new Error("api "+res.status); e.status=res.status; e.detail=msg; throw e;
  }
  const j=await res.json();
  const text=j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content;
  if(!text) throw new Error("empty response");
  return text.trim();
}

async function ai(prompt,web){
  // 기록·자산 정보가 외부 AI로 나가므로, 사용자가 안내를 읽고 동의하기 전에는 어떤 요청도 보내지 않는다.
  if(!S.settings.aiConsent){ const e=new Error("noconsent"); e.noconsent=true; throw e; }
  if((S.settings.provider||"gemini")==="factchat"){
    return await callFactChat(prompt,web);
  }
  const k=(S.settings.apiKey||"").trim();
  if(!k){ const e=new Error("nokey"); e.nokey=true; throw e; }
  const chain=modelChain();
  let idx=activeModelIndex();
  let lastErr=null;
  for(; idx<chain.length; idx++){
    try{
      const text=await callGemini(chain[idx],prompt,web);
      if(idx!==(S.settings.modelIndex||0)){ S.settings.modelIndex=idx; S.settings.modelDate=today(); await saveLocal(S,false); }
      return text;
    }catch(e){
      lastErr=e;
      if(e&&e.status===429&&idx<chain.length-1){ continue; } // 이 모델 한도 초과 → 다음 모델로
      throw e;
    }
  }
  throw lastErr||new Error("모든 모델의 한도를 초과했습니다.");
}
function aiErr(e,what){
  const fc=(S.settings.provider||"gemini")==="factchat";
  if(e&&e.noconsent) return "더보기 → 설정 → AI 연결에서 데이터 전송 안내를 읽고 동의해야 AI 기능을 쓸 수 있어요.";
  if(e&&e.nokey) return fc?"설정 탭에서 FactChat API 키와 모델 ID를 먼저 입력해 주세요.":"설정 탭에서 Google AI Studio API 키를 먼저 입력해 주세요.";
  if(e&&e.status===429) return fc?"게이트웨이 한도(크레딧)에 걸렸습니다. 대시보드에서 남은 크레딧을 확인해 주세요.":"오늘 등록된 모델을 모두 써서 한도에 걸렸습니다. 내일 다시 시도하거나 설정에서 모델 목록을 늘려주세요.";
  if(e&&e.status===404) return fc?"모델 ID를 찾을 수 없습니다. 대시보드의 모델 목록에서 정확한 ID를 다시 확인해 주세요.":"모델 이름을 찾을 수 없습니다. 설정에서 모델 목록을 확인해 주세요.";
  if(e&&e.status===401) return fc?"API 키 인증에 실패했습니다. 대시보드에서 키를 다시 확인해 주세요.":"API 키가 올바르지 않습니다.";
  if(e&&e.status===400&&/API key/i.test(e.detail||"")) return "API 키가 올바르지 않습니다. 설정에서 다시 확인해 주세요.";
  return what+"에 실패했습니다. 잠시 후 다시 시도해 주세요."+(e&&e.detail?` (${e.detail.slice(0,80)})`:"");
}

function calc(){
  const stocksSum=S.stocks.reduce((a,b)=>a+(b.currentPrice!=null?b.currentPrice:b.buyPrice)*b.qty,0);
  const othersSum=S.others.reduce((a,b)=>a+b.amount,0);
  const totalAssets=stocksSum+othersSum;
  const totalDebt=(S.debts||[]).reduce((a,b)=>a+b.amount,0);
  return {stocksSum,othersSum,totalAssets,totalDebt,net:totalAssets-totalDebt};
}
function touchNetWorthSnapshot(){
  const c=calc(), m=ym(today());
  S.netWorthHistory=Array.isArray(S.netWorthHistory)?S.netWorthHistory:[];
  const snap={ym:m,date:today(),net:Math.round(c.net),assets:Math.round(c.totalAssets),debt:Math.round(c.totalDebt)};
  const i=S.netWorthHistory.findIndex(x=>x.ym===m);
  const before=i>=0?JSON.stringify(S.netWorthHistory[i]):"";
  if(i>=0) S.netWorthHistory[i]=snap; else S.netWorthHistory.push(snap);
  S.netWorthHistory=S.netWorthHistory.sort((a,b)=>a.ym.localeCompare(b.ym)).slice(-36);
  return i<0||before!==JSON.stringify(snap);
}

function pie(rows,total,size,big,empty){
  if(!total) return `<div class="faint" style="padding:12px 0">${empty}</div>`;
  let a=-90; const r=size/2-1,cx=size/2,cy=size/2;
  const xy=t=>[cx+r*Math.cos(t*Math.PI/180),cy+r*Math.sin(t*Math.PI/180)];
  let paths="",leg="";
  rows.forEach(row=>{
    const f=row.sum/total,st=a,en=a+f*360; a=en;
    const lg=en-st>180?1:0,[x1,y1]=xy(st),[x2,y2]=xy(en);
    const col=CAT_COLOR[row.cat]||"#A8BAC2";
    paths+=`<path d="M${cx},${cy} L${x1.toFixed(2)},${y1.toFixed(2)} A${r},${r} 0 ${lg} 1 ${x2.toFixed(2)},${y2.toFixed(2)} Z" fill="${col}" stroke="var(--surface)" stroke-width="2" stroke-linejoin="round"/>`;
    leg+=`<div class="legend" style="font-size:${big?12.5:11.5}px"><i style="background:${col}"></i><span class="nm">${esc(row.cat)}</span><span class="pc">${Math.round(f*100)}%</span></div>`;
  });
  return `<div class="piewrap">
    <div style="position:relative;width:${size}px;height:${size}px;flex:0 0 auto">
      <svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${paths}<circle cx="${cx}" cy="${cy}" r="${r*0.58}" fill="var(--surface)"/></svg>
      <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
        <span class="num" style="font-size:${big?14:11.5}px">${won(total)}</span></div>
    </div><div style="flex:1;min-width:0">${leg}</div></div>`;
}

/* ── 월별 지출 막대 + 추세선 ── */
// zoom=true면 0원이 아니라 값의 범위에 맞춰 세로축을 잡는다 (순자산처럼 큰 값의 작은 변화용).
function trendChart(months,vals,color,label,zoom){
  const W=320,H=120,pad=22,bw=(W-pad*2)/months.length*0.55;
  const max=Math.max(...vals,1), min=Math.min(...vals);
  const span=max-min||Math.abs(max)*0.02||1;
  const lo=zoom?min-span*0.35:0, hi=zoom?max+span*0.2:max;
  const x=i=>pad+(W-pad*2)/months.length*(i+0.5);
  const y=v=>H-8-((v-lo)/(hi-lo))*(H-34);
  let bars="",line="",area="",dots="",labels="";
  months.forEach((m,i)=>{
    if(!zoom){
      const bh=(vals[i]/max)*(H-34);
      bars+=`<rect x="${(x(i)-bw/2).toFixed(1)}" y="${(H-8-bh).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(0,bh).toFixed(1)}" rx="2" fill="${color}" opacity="0.22"/>`;
    }
    line+=`${i?"L":"M"}${x(i).toFixed(1)},${y(vals[i]).toFixed(1)}`;
    dots+=`<circle cx="${x(i).toFixed(1)}" cy="${y(vals[i]).toFixed(1)}" r="${zoom?3.5:2.6}" fill="${color}" stroke="#fff" stroke-width="${zoom?2:0}"><title>${mLabel(m)} ${won(vals[i])}원</title></circle>`;
    labels+=`<text x="${x(i).toFixed(1)}" y="${H+4}" font-size="9.5" fill="var(--ink3)" text-anchor="middle">${mLabel(m)}</text>`;
  });
  if(zoom&&months.length>1) area=`<path d="${line}L${x(months.length-1).toFixed(1)},${H-8}L${x(0).toFixed(1)},${H-8}Z" fill="${color}" opacity="0.1"/>`;
  return `<svg viewBox="0 0 ${W} ${H+10}" width="100%" style="display:block;overflow:visible">
    ${bars}${area}<path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}${labels}
  </svg>
  <div class="faint" style="text-align:right;margin-top:2px">${label} · ${zoom&&months.length>1?`${uk(min)} ~ ${uk(max)}`:`최고 ${won(max)}원`}</div>`;
}

/* ── 월별 수입 누적 막대 (본봉 / 부수입) ── */
function stackedIncome(months,base,side){
  const W=320,H=120,pad=22,bw=(W-pad*2)/months.length*0.55;
  const totals=months.map((_,i)=>base[i]+side[i]);
  const max=Math.max(...totals,1);
  const x=i=>pad+(W-pad*2)/months.length*(i+0.5);
  let bars="",labels="";
  months.forEach((m,i)=>{
    const hb=(base[i]/max)*(H-34), hs=(side[i]/max)*(H-34);

    labels+=`<text x="${x(i).toFixed(1)}" y="${H+4}" font-size="9.5" fill="var(--ink3)" text-anchor="middle">${mLabel(m)}</text>`;

}

function monthAgg(m){
  const tx=S.tx.filter(t=>ym(t.date)===m);
  return {
    expense: tx.filter(t=>t.type==="expense").reduce((a,b)=>a+b.amount,0),
    base:    tx.filter(t=>t.type==="income"&&!t.sideIncome).reduce((a,b)=>a+b.amount,0),
    side:    tx.filter(t=>t.type==="income"&&t.sideIncome).reduce((a,b)=>a+b.amount,0)
  };
}

function bar(pct,color){ return `<div class="bar"><i style="width:${Math.max(0,Math.min(100,pct))}%${color?";background:"+color:""}"></i></div>`; }
function spin(on,label){ return on?`<span class="spin"></span>${label}`:label; }

function txEntry(t){

}
function dateGroups(list){
  const groups={};
  [...list].sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:0).forEach(t=>{(groups[t.date]=groups[t.date]||[]).push(t)});
  return Object.entries(groups);
}
function weekStart(dateStr){
  const d=new Date(dateStr+"T12:00:00+09:00");
  const offset=(d.getDay()+6)%7;
  d.setDate(d.getDate()-offset);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function addDate(dateStr,n){
  const d=new Date(dateStr+"T12:00:00+09:00"); d.setDate(d.getDate()+n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

    S.targets.forEach(t=>{

        <div class="rowline" style="gap:8px;margin-bottom:8px"><input type="text" data-tname="${t.id}" value="${esc(t.name)}" placeholder="예: 전세 보증금, 결혼 자금"><button class="del" data-tdel="${t.id}" style="flex:0 0 auto">×</button></div>

          <div><div class="lbl">목표 금액</div><input type="text" class="amt" data-tprice="${t.id}" inputmode="numeric" value="${won(t.price)}"></div>

        </div></div>`:`<div class="card"><div class="rowline"><div><strong>${esc(t.name)}</strong><div class="faint" style="margin-top:4px">${t.years}년 안에</div></div><span class="num">${uk(t.price)}</span></div></div>`;
    });
    if(!S.targets.length&&!assetEdit) h+=`<div class="faint" style="padding:4px 2px 10px">아직 목표가 없어요. 위의 "자산 수정"을 눌러 추가해 보세요.</div>`;

  }

    if(!S.chat.length){
      h+=`<div class="faint" style="padding:16px 0">아직 질문이 없어요. 예: "월급의 몇 %를 저축하는 게 좋을까요?" / "비상금은 얼마나 모아두면 될까요?" / "ISA 계좌는 어떻게 활용하면 좋을까요?"</div>`;

    <div class="card" style="margin-bottom:8px">
      <div class="btnrow">
        <button class="btn ${S.settings.provider!=="factchat"?"":"ghost"}" id="provGemini">Google Gemini (무료)</button>

    ${S.settings.provider==="factchat" ? `
    <div class="card">
      <div class="field"><div class="lbl">API 키</div>

      <div class="field"><div class="lbl">Base URL</div>

        <input type="text" data-set="factchatModel" value="${esc(S.settings.factchatModel)}" placeholder="대시보드 모델 목록의 정확한 ID"></div>
      <div class="faint">학교 등에서 제공하는 OpenAI 호환 게이트웨이(예: 아이스크림에듀 FactChat)를 쓸 때 입력하세요. 실시간 웹 검색이 안 될 수 있어 시세 확인은 정확도가 떨어질 수 있습니다.</div>
      <div class="btnrow" style="margin-top:10px"><button class="btn ghost tiny" id="testai" ${busy.aiTest?"disabled":""}>${spin(busy.aiTest,busy.aiTest?"확인 중…":"연결 테스트")}</button></div>
      ${window.__aiTestResult?`<div class="faint" style="margin-top:8px;white-space:pre-wrap">${esc(window.__aiTestResult)}</div>`:""}

    ` : `
    <div class="card">
      <div class="field"><div class="lbl">Google AI Studio API 키</div>
        <input type="password" autocomplete="new-password" data-set="apiKey" value="${esc(S.settings.apiKey)}" placeholder="AIza..."></div>
      <div class="faint">aistudio.google.com → <b>Get API key</b>에서 무료로 발급받아 붙여넣으세요. 키는 이 기기 브라우저에만 저장되고 구글 외 다른 곳으로 전송되지 않습니다.</div>
      <details style="margin-top:10px"><summary class="faint" style="cursor:pointer">고급 — 사용할 모델 순서</summary>
        <div class="field" style="margin-top:8px"><input type="text" data-set="modelChain" value="${esc(S.settings.modelChain||DEFAULT_CHAIN)}" placeholder="${DEFAULT_CHAIN}"></div>
        <div class="faint">첫 모델의 무료 한도를 다 쓰면 다음 모델로 자동으로 넘어갑니다.</div></details>
      ${S.settings.modelIndex?`<div class="faint" style="margin-top:8px;color:var(--amber)">오늘은 ${(S.settings.modelChain||DEFAULT_CHAIN).split(",")[S.settings.modelIndex]||""} 모델을 쓰고 있어요 (앞 모델 한도 초과).</div>`:""}
      <div class="btnrow" style="margin-top:10px"><button class="btn ghost tiny" id="testai" ${busy.aiTest?"disabled":""}>${spin(busy.aiTest,busy.aiTest?"확인 중…":"연결 테스트")}</button></div>
      ${window.__aiTestResult?`<div class="faint" style="margin-top:8px;white-space:pre-wrap">${esc(window.__aiTestResult)}</div>`:""}

    <div class="sec" id="budgetSettings">월 예산</div>

        ${bi.rows.map(r=>`<label class="budget-input"><span class="lbl">${esc(r.cat)}</span><input type="text" inputmode="numeric" data-budget-cat="${esc(r.cat)}" value="${r.budget?won(r.budget):''}" placeholder="0"></label>`).join("")}
      </div></div></details></div>

    <div class="sec">나에 대해 (AI 조언에 참고)</div>
    <div class="faint" style="margin:-4px 2px 10px">적어두면 상담과 분석이 내 상황에 맞춰져요. 비워둬도 됩니다.</div>
    <div class="card"><div class="lbl">목표 / 투자성향</div>
      <div class="field"><input type="text" data-prof="goal" value="${esc(S.profile.goal)}" placeholder="예: 3년 안에 전세 자금 마련"></div>
      <select data-prof="risk">${["안정형","중립형","공격형"].map(r=>`<option${r===S.profile.risk?" selected":""}>${r}</option>`).join("")}</select></div>
    <div class="card"><div class="lbl">소득 구조</div>
      <textarea rows="2" data-prof="incomeNote" placeholder="예: 월급 세후 300만원, 부수입 월 20만원 정도">${esc(S.profile.incomeNote)}</textarea></div>
    <div class="card"><div class="lbl">생활 배경</div>
      <textarea rows="2" data-prof="lifeNote" placeholder="예: 1인 가구, 2년 뒤 결혼 계획">${esc(S.profile.lifeNote)}</textarea></div>
    <div class="card"><div class="lbl">조언할 때 지켜줬으면 하는 것</div>
      <textarea rows="2" data-prof="coachNote" placeholder="예: 운동·자기계발 비용은 줄이라고 하지 말아 주세요">${esc(S.profile.coachNote)}</textarea></div>

    <div class="sec">데이터</div>
    <div class="faint" style="margin:-4px 2px 10px">모든 기록은 이 기기의 이 브라우저에만 저장돼요. 기기를 바꾸거나 브라우저 데이터를 지우기 전에 꼭 내보내기로 백업하세요. 새 기기에서는 가져오기로 불러오면 됩니다.</div>
    <div class="note ${needsBackup()?"warn":"info"}" style="margin-bottom:10px">마지막 백업: ${S.meta?.lastBackup?savedTime(S.meta.lastBackup):"아직 없음"}${isIOS&&!isStandalone()?"<br>아이폰 사파리로 열려 있어요. 공유 버튼 → '홈 화면에 추가'로 쓰면 기록이 더 안전하게 유지됩니다.":""}</div>
    <div class="btnrow">
      <button class="btn ghost" id="exp">내보내기 (백업)</button>
      <button class="btn ghost" id="imp">가져오기</button>
    </div>
    <details style="margin-top:22px"><summary class="muted" style="cursor:pointer">모든 데이터 지우기</summary>
      <div class="card" style="margin-top:10px"><div class="faint" style="margin-bottom:10px">기록, 주식, 목표, 설정이 모두 지워지고 처음 상태로 돌아갑니다. 되돌릴 수 없어요.</div>
      <button class="btn ghost" id="resetAll" style="color:var(--down)">모두 지우기</button></div></details>
    <div class="faint" style="margin-top:22px">계좌번호·카드번호 같은 민감한 정보는 적지 마세요.</div>`;
  }
  document.getElementById("app").innerHTML=h;
  bind();
}

/* ══════════════ 이벤트 바인딩 ══════════════ */
function bind(){
  const $=s=>document.querySelector(s), $$=s=>document.querySelectorAll(s);
  $$("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;notice="";render()});
  $$("[data-moretab]").forEach(b=>b.onclick=()=>{tab=b.dataset.moretab;notice="";render()});
  // 홈의 빠른 기록 버튼은 종류(지출/수입)를 정해서 기록 탭으로 보낸다.
  $$("[data-quick]").forEach(b=>b.onclick=()=>{recordType=b.dataset.quick;txView=b.dataset.quick;tab="기록";render();setTimeout(()=>document.querySelector("#txin")?.focus(),0)});
  $$("[data-rectype]").forEach(b=>b.onclick=()=>{recordType=b.dataset.rectype||null;if(recordType)txView=recordType;render()});
  $$("[data-openbudget]").forEach(b=>b.onclick=()=>{tab="설정";render();setTimeout(()=>document.querySelector("#budgetSettings")?.scrollIntoView({behavior:"smooth"}),0)});
  $$("[data-openai]").forEach(b=>b.onclick=()=>{tab="설정";render();setTimeout(()=>document.querySelector("#aiSettings")?.scrollIntoView({behavior:"smooth"}),0)});
  $$("[data-gotogoals]").forEach(b=>b.onclick=()=>{tab="자산";assetEdit=true;render();setTimeout(()=>document.querySelector("#goalsSec")?.scrollIntoView({behavior:"smooth"}),0)});
  $$("[data-txview]").forEach(b=>b.onclick=()=>{txView=b.dataset.txview;render()});

  const ta=$("#txin");
  if(ta){ ta.oninput=()=>window.__draft=ta.value; }
  if($("#txdate")) $("#txdate").onchange=e=>{window.__txDate=e.target.value||today();};

  const chatTa=$("#chatin");
  if(chatTa){
    chatTa.oninput=()=>window.__chatDraft=chatTa.value;
    chatTa.onkeydown=(e)=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); $("#chatsend").click(); } };
  }
  if($("#chatsend")) $("#chatsend").onclick=()=>{
    const q=(window.__chatDraft||"").trim();
    if(!q||busy.chat) return;
    window.__chatDraft="";
    askAdvisor(q);
  };

  if($("#doparse")) $("#doparse").onclick=doParse;
  if($("#cancelpend")) $("#cancelpend").onclick=()=>{pending=[];render()};
  if($("#savepend")) $("#savepend").onclick=async()=>{
    S.tx=[...S.tx,...pending]; pending=[]; window.__draft=""; notice=""; await commit();
  };
  $$("[data-pcat]").forEach(el=>el.onchange=()=>{const i=+el.dataset.pcat;const v=el.value;
    pending[i].cat=v; pending[i].type=v==="수입"?"income":"expense"; render()});
  $$("[data-pitem]").forEach(el=>el.oninput=()=>{pending[+el.dataset.pitem].item=el.value});
  $$("[data-pamt]").forEach(el=>el.oninput=()=>{pending[+el.dataset.pamt].amount=num(el.value)});
  $$("[data-del]").forEach(el=>el.onclick=async()=>{S.tx=S.tx.filter(t=>t.id!==el.dataset.del);await commit()});

  if($("#toggleAssetEdit")) $("#toggleAssetEdit").onclick=()=>{assetEdit=!assetEdit;render()};
  if($("#budgetTotal")) $("#budgetTotal").onchange=async e=>{S.budgets=S.budgets||{monthlyTotal:0,categories:{}};S.budgets.monthlyTotal=num(e.target.value);await commit()};
  $$("[data-budget-cat]").forEach(el=>el.onchange=async()=>{S.budgets=S.budgets||{monthlyTotal:0,categories:{}};S.budgets.categories=S.budgets.categories||{};S.budgets.categories[el.dataset.budgetCat]=num(el.value);await commit()});

  $$("[data-stacct-tab]").forEach(el=>el.onclick=()=>{ stockAcctTab=el.dataset.stacctTab; render(); });
  if($("#addstock")) $("#addstock").onclick=async()=>{
    const n=$("#stname").value.trim();
    const code=normCode($("#stcode").value);
    const buy=num($("#stbuy").value);
    const qty=num($("#stqty").value);
    const acct=$("#stacct").value||"일반";
    if(!n||!buy||!qty){ notice="종목 이름, 매수가, 개수를 모두 입력해 주세요."; return render(); }
    if(S.stocks.some(s=>s.name===n&&(s.account||"일반")===acct)){
      notice=`이미 ${acct}계좌에 "${n}" 종목이 있어요. 매수가·개수를 고치려면 기존 항목을 직접 수정해 주세요.`;
      return render();
    }
    S.stocks.push({id:uid(),name:n,code,account:acct,buyPrice:buy,qty,currentPrice:null,priceDate:null});
    notice=""; await commit();
  };
  const stockOf=id=>S.stocks.find(x=>x.id===id);
  $$("[data-delstock]").forEach(el=>el.onclick=async()=>{S.stocks=S.stocks.filter(s=>s.id!==el.dataset.delstock);await commit()});
  $$("[data-scode]").forEach(el=>el.onchange=async()=>{stockOf(el.dataset.scode).code=normCode(el.value);await commit()});
  $$("[data-sbuy]").forEach(el=>el.onchange=async()=>{stockOf(el.dataset.sbuy).buyPrice=num(el.value);await commit()});
  $$("[data-sqty]").forEach(el=>el.onchange=async()=>{stockOf(el.dataset.sqty).qty=num(el.value);await commit()});
  $$("[data-scur]").forEach(el=>el.onchange=async()=>{
    const s=stockOf(el.dataset.scur), v=num(el.value);
    s.currentPrice=v||null; s.priceDate=v?today():null; await commit();
  });
  $$("[data-sacct]").forEach(el=>el.onchange=async()=>{stockOf(el.dataset.sacct).account=el.value;await commit()});
  if($("#fetchprices")) $("#fetchprices").onclick=fetchPriceProposals;
  if($("#applyreview")) $("#applyreview").onclick=applyPriceReview;
  if($("#cancelreview")) $("#cancelreview").onclick=()=>{window.__priceReview=null; render();};
  $$("[data-rvinc]").forEach(el=>el.onchange=()=>{window.__priceReview[+el.dataset.rvinc].include=el.checked;});
  $$("[data-rvedit]").forEach(el=>el.onchange=()=>{window.__priceReview[+el.dataset.rvedit].edited=num(el.value);});

  // 현금·예금(others)과 부채(debts) 목록은 같은 방식으로 편집한다.
  [["other","others","새 자산"],["debt","debts","새 부채"]].forEach(([kind,key,label])=>{
    const list=()=>(S[key]=S[key]||[]);
    $$(`[data-${kind}add]`).forEach(el=>el.onclick=async()=>{list().push({id:uid(),name:label,amount:0});await commit()});
    $$(`[data-${kind}name]`).forEach(el=>el.onchange=async()=>{list().find(x=>x.id===el.getAttribute(`data-${kind}name`)).name=el.value;await commit()});
    $$(`[data-${kind}amt]`).forEach(el=>el.onchange=async()=>{list().find(x=>x.id===el.getAttribute(`data-${kind}amt`)).amount=num(el.value);await commit()});
    $$(`[data-${kind}del]`).forEach(el=>el.onclick=async()=>{S[key]=list().filter(x=>x.id!==el.getAttribute(`data-${kind}del`));await commit()});
  });

  const goalOf=id=>S.targets.find(t=>t.id===id);
  $$("[data-tname]").forEach(el=>el.onchange=async()=>{goalOf(el.dataset.tname).name=el.value;await commit()});
  $$("[data-tprice]").forEach(el=>el.onchange=async()=>{goalOf(el.dataset.tprice).price=num(el.value);await commit()});
  $$("[data-tyears]").forEach(el=>el.onchange=async()=>{goalOf(el.dataset.tyears).years=Math.max(1,+el.value||1);await commit()});
  $$("[data-tdel]").forEach(el=>el.onclick=async()=>{S.targets=S.targets.filter(t=>t.id!==el.dataset.tdel);await commit()});
  if($("#addgoal")) $("#addgoal").onclick=async()=>{S.targets.push({id:uid(),name:"새 목표",price:10000000,years:1});await commit()};

  if($("#genweek")) $("#genweek").onclick=()=>genFinance("week");
  if($("#genmonth")) $("#genmonth").onclick=()=>genFinance("month");

  $$("[data-prof]").forEach(el=>el.onchange=async()=>{S.profile[el.dataset.prof]=el.value;await commit()});
  $$("[data-set]").forEach(el=>{
    const flush=async(rerender)=>{
      S.settings[el.dataset.set]=el.value.trim();
      await saveLocal(S);
      if(rerender) render();
    };
    el.oninput=()=>{ clearTimeout(el.__t); el.__t=setTimeout(()=>flush(false),500); };
    el.onchange=()=>{ clearTimeout(el.__t); flush(true); };
    el.onblur=()=>{ clearTimeout(el.__t); flush(false); };
  });
  if($("#provGemini")) $("#provGemini").onclick=async()=>{S.settings.provider="gemini";await commit()};
  if($("#provFactchat")) $("#provFactchat").onclick=async()=>{S.settings.provider="factchat";await commit()};
  if($("#aiConsent")) $("#aiConsent").onchange=async e=>{S.settings.aiConsent=e.target.checked;await commit()};
  if($("#testai")) $("#testai").onclick=async()=>{
    busy.aiTest=true; window.__aiTestResult=""; render();
    try{
      const text=await ai(`오늘 날짜(연월일)를 정확히 말해줘. 그리고 지금 시점 기준 코스피 지수가 대략 얼마인지도 웹 검색해서 알려줘. 모르면 모른다고 솔직히 말해줘. 2~3문장으로.`, true);
      window.__aiTestResult="✅ 응답 성공:\n"+text;
    }catch(e){
      window.__aiTestResult="❌ "+aiErr(e,"연결 테스트");
    }
    busy.aiTest=false; render();
  };
  // 백업 파일은 남에게 보낼 수도 있으니 AI 키는 빼고 저장한다 (doBackup).
  if($("#exp")) $("#exp").onclick=doBackup;
  $$("[data-backup]").forEach(b=>b.onclick=doBackup);
  $$("[data-snooze]").forEach(b=>b.onclick=async()=>{const d=new Date();d.setDate(d.getDate()+7);S.meta={...(S.meta||{}),backupSnooze:dstr(d)};await commit()});
  $$("[data-welcomed]").forEach(b=>b.onclick=async()=>{S.meta={...(S.meta||{}),welcomed:true};await commit()});
  if($("#imp")) $("#imp").onclick=()=>{
    const inp=document.createElement("input");inp.type="file";inp.accept="application/json";
    inp.onchange=async()=>{const f=inp.files[0];if(!f)return;
      try{
        const keep={apiKey:S.settings.apiKey,factchatKey:S.settings.factchatKey};
        S=merge(DEFAULT,JSON.parse(await f.text()));
        if(!S.settings.apiKey) S.settings.apiKey=keep.apiKey;
        if(!S.settings.factchatKey) S.settings.factchatKey=keep.factchatKey;
        await commit(); notice="가져왔습니다."; render();
      }catch(e){ notice="파일을 읽지 못했습니다."; render(); } };
    inp.click();
  };
  if($("#resetAll")) $("#resetAll").onclick=async()=>{
    if(!confirm("정말 모든 데이터를 지울까요? 되돌릴 수 없어요.")) return;
    S=JSON.parse(JSON.stringify(DEFAULT)); pending=[]; window.__draft=""; tab="홈"; notice="모든 데이터를 지웠습니다."; await commit();
  };
}

/* ══════════════ 액션 ══════════════ */
async function doParse(){
  const text=(window.__draft||"").trim();
  if(!text)return;
  // 날짜 칸에서 고른 날짜가 기본, 메모에 "어제/그저께"가 있으면 그쪽을 따른다.
  const picked=window.__txDate||today();
  const date=/어제|그저께|그제/.test(text)?resolveDate(text):picked;
  const force=recordType;
  busy.parse=true; notice=""; render();
  try{
    const raw=await ai(`오늘은 ${today()}이다. 가계부 메모를 항목별로 분해해 JSON 배열만 출력해라(설명·마크다운 금지).
각 원소: {"type":"expense"|"income","amount":정수,"cat":카테고리,"item":"짧은 항목명","sideIncome":true|false}
지출 카테고리는 정확히 이 중 하나: ${EXP_CATS.join(", ")}. 수입이면 cat은 "수입".
${force?`이 메모는 모두 ${force==="income"?"수입":"지출"}이다. type을 모두 "${force}"로 해라.`:""}
수입 중 본업 월급이 아닌 것(부수입, 강의료, 월세, 배당, 이자, 원고료 등)은 sideIncome=true. 월급·급여는 sideIncome=false.
메모: ${text}`,false);
    const arr=JSON.parse(stripJson(raw));
    const items=arr.filter(x=>x&&x.amount>0).map(x=>{
      const type=force||(x.type==="income"?"income":"expense");
      return {id:uid(),date,type,amount:Math.round(x.amount),
        cat:type==="income"?"수입":(EXP_CATS.includes(x.cat)?x.cat:"기타"),
        item:String(x.item||"").slice(0,24),sideIncome:type==="income"&&!!x.sideIncome};
    });
    if(!items.length) throw new Error("empty");
    pending=items;
  }catch(e){
    const fb=localParse(text,force).map(x=>({...x,date}));
    if(fb.length){ pending=fb; notice=(e&&(e.nokey||e.noconsent))?"AI가 연결되지 않아 간단 규칙으로 읽었어요. 분류를 확인해 주세요.":"자동 분류를 쓸 수 없어 간단 규칙으로 읽었어요. 확인해 주세요."; }
    else notice="금액을 찾지 못했습니다. 예: '점심 9천원'";
  }
  busy.parse=false; render();
}

function ctx(){
  const c=calc();
  const recentQs=(S.chat||[]).filter(m=>m.role==="user").slice(-5).map(m=>m.text);
  const p=S.profile;
  return `[고객 상황]
${p.goal?`목표: ${p.goal} / `:""}투자성향: ${p.risk}
${p.lifeNote?`생활 배경: ${p.lifeNote}\n`:""}${p.incomeNote?`소득 구조: ${p.incomeNote}\n`:""}자산: 주식·ETF ${won(c.stocksSum)}원, 현금·예금 등 ${won(c.othersSum)}원 (${S.others.map(o=>o.name+" "+won(o.amount)).join(", ")||"없음"})
부채: ${(S.debts||[]).length?S.debts.map(d=>d.name+" "+won(d.amount)+"원").join(", "):"없음"}
순자산: ${won(c.net)}원
재무 목표: ${S.targets.map(t=>`${t.name} ${uk(t.price)} (${t.years}년 내)`).join(" / ")||"없음"}
${recentQs.length?`[고객이 상담 탭에서 최근 물어본 것들 — 관련 있으면 참고해라] ${recentQs.map(q=>`"${q}"`).join(" / ")}`:""}
${p.coachNote?`[반드시 지킬 것] ${p.coachNote}`:""}`;
}

async function askAdvisor(question){
  S.chat.push({id:uid(),role:"user",text:question,date:today()});
  S.chat=S.chat.slice(-60);
  busy.chat=true; notice=""; render();
  const history=S.chat.slice(-9,-1).map(m=>`${m.role==="user"?"고객":"재무설계사"}: ${m.text}`).join("\n");
  const p=`너는 대한민국 최고의 재무설계사다. 신중하고 직설적으로, 그러나 따뜻하게 상담해라. 확정적 예측은 피하고 근거를 들어 설명해라. 필요하면 웹 검색으로 최신 정보를 확인해라.
${ctx()}
${history?`[지금까지의 대화]\n${history}\n`:""}
[고객의 질문] ${question}

3~6문장으로 답해라. 고객이 적어둔 가치관이 있으면 지켜라. 특정 종목·펀드·상품의 매수·매도를 권유하거나 수익을 장담하지 말고, 일반적인 원칙과 선택지, 위험을 함께 설명해라. 마크다운·목록 기호 없이 대화체 문장으로만.`;
  try{
    const text=await ai(p,true);
    S.chat.push({id:uid(),role:"assistant",text,date:today()});
  }catch(e){
    S.chat.push({id:uid(),role:"assistant",text:"["+aiErr(e,"답변 생성")+"]",date:today()});
  }
  busy.chat=false;
  await saveLocal(S);
  render();
}

async function genFinance(kind){
  busy[kind]=true; notice=""; render();
  const from=kind==="week"?daysAgo(7):monthStart();
  const rows=catRows(from);
  const range=S.tx.filter(t=>t.date>=from);
  const inc=range.filter(t=>t.type==="income").reduce((a,b)=>a+b.amount,0);
  const exp=rows.reduce((a,b)=>a+b.sum,0);
  const p=`너는 신중하고 직설적인 한국의 재무설계사다. 아래 고객의 ${kind==="week"?"지난 일주일":"이번 달"} 재무 리포트를 한국어로 써라.
${ctx()}
[기간 데이터] 지출 ${won(exp)}원, 수입 ${won(inc)}원 (주 수입 ${won(range.filter(t=>t.type==="income"&&!t.sideIncome).reduce((a,b)=>a+b.amount,0))}원, 부수입 ${won(range.filter(t=>t.type==="income"&&t.sideIncome).reduce((a,b)=>a+b.amount,0))}원)
카테고리별 지출: ${JSON.stringify(rows)}
전체 기록: ${JSON.stringify(range.slice(0,120).map(t=>({date:t.date,type:t.type,cat:t.cat,item:t.item,amount:t.amount})))}

${kind==="week"
? `주간 리포트다. 문단 3개로 상세히 써라. ①이번 주 소비 흐름과 눈에 띈 지점 ②저축 여력 평가 ③다음 주에 구체적으로 시도해볼 것 한두 가지.`
: `월간 리포트다. 주간보다 훨씬 구체적으로, 문단 4개로 써라. ①이번 달 수입·지출 총평과 저축률 ②카테고리별 분석과 눈에 띄는 변화 ③목표 진행 상황과 순자산 변화 ④다음 달 실행 계획을 숫자와 함께 구체적으로.`}
마크다운·제목·목록 기호 없이 문단으로만 써라. 특정 종목·펀드·상품의 매수·매도를 권유하거나 수익을 장담하지 말고, 일반적인 원칙과 선택지, 위험을 함께 설명해라.`;
  try{
    const text=await ai(p,false);
    if(kind==="week") S.reports.weekly=[{date:today(),text},...S.reports.weekly].slice(0,8);
    else S.reports.monthly=[{ym:ym(today()),text},...S.reports.monthly.filter(r=>r.ym!==ym(today()))].slice(0,12);
    await saveLocal(S);
  }catch(e){ notice=aiErr(e,"리포트 생성"); }
  busy[kind]=false; render();
}

function aiConfigured(){
  if(!S.settings.aiConsent) return false;
  return (S.settings.provider||"gemini")==="factchat"
    ? !!((S.settings.factchatKey||"").trim() && (S.settings.factchatModel||"").trim())
    : !!(S.settings.apiKey||"").trim();
}

/* 시세 조회: AI 웹검색으로 후보값을 받아온 뒤, 바로 반영하지 않고
   "제안 → 확인 → 적용" 단계를 거친다. 종목마다 이전가와 나란히 보여줘서
   이상한 값(오독·오검색)은 사람이 바로 걸러낼 수 있게 한다. */
async function fetchPriceProposals(){
  if(!S.stocks.length) return;
  const needed=S.stocks.filter(x=>x.priceDate!==today());
  if(!needed.length){ notice="이미 오늘자 시세로 갱신되어 있어요."; return render(); }
  if(!aiConfigured()){ notice="더보기 → 설정 → AI 연결에서 키를 넣고 데이터 전송 안내에 동의해 주세요."; return render(); }

  busy.stocks=true; notice=""; window.__priceReview=null; render();
  try{
    const raw=await ai(`너는 국내외 증시 데이터에 정확한 전문가다. 웹 검색으로 아래 종목들의 "가장 최근 거래일(전날 또는 그 이전 마지막 거래일) 종가"를 조사해라.
- 반드시 실제로 검색해서 찾은 값만 답하고, 추측하지 마라.
- 확신이 없으면 confident를 false로 표시해라.
- 해외 종목은 최근 환율로 원화 환산한 값을 price에 넣어라.
종목 목록: ${needed.map((x,i)=>`${i+1}) ${x.name}${normCode(x.code)?" ("+normCode(x.code)+")":""}`).join(", ")}
JSON 배열만 출력해라(설명·마크다운 없이). idx는 위 번호와 같게 해라:
[{"idx":1,"price":정수(1주당 원),"basisDate":"YYYY-MM-DD(종가 기준일)","confident":true|false}]`,true);
    const arr=JSON.parse(stripJson(raw));
    window.__priceReview = needed.map((x,i)=>{
      const hit=arr.find(o=>Number(o.idx)===i+1)||arr[i]||{};
      const proposed = hit.price>0 ? Math.round(hit.price) : null;
      return {
        id:x.id, name:x.name, oldPrice: x.currentPrice, buyPrice:x.buyPrice,
        proposed, basisDate: hit.basisDate||null, confident: hit.confident!==false,
        include: proposed!=null, edited: proposed
      };
    });
  }catch(e){ notice=aiErr(e,"시세 조회"); }
  busy.stocks=false; render();
}

function applyPriceReview(){
  const rows=window.__priceReview||[];
  let applied=0;
  rows.forEach(r=>{
    if(!r.include) return;
    const v=Number(r.edited);
    if(!(v>0)) return;
    const st=S.stocks.find(s=>s.id===r.id);
    if(!st) return;
    st.currentPrice=Math.round(v);
    st.priceDate=r.basisDate||today();
    st.err=null;
    applied++;
  });
  window.__priceReview=null;
  notice = applied ? `${applied}개 종목에 반영했습니다.` : "선택된 항목이 없어 반영하지 않았습니다.";
  saveLocal(S);
  render();
}

(async function(){
  const saved=await loadLocal();
  if(saved) S=merge(DEFAULT,saved);
  if(!S.meta?.firstUse) S.meta={...(S.meta||{}),firstUse:new Date().toISOString()};
  touchNetWorthSnapshot();
  await saveLocal(S);
  render();
  // 브라우저가 저장 공간이 부족할 때 이 사이트 데이터를 지우지 않도록 요청한다 (지원 안 하면 무시).
  try{ if(navigator.storage&&navigator.storage.persist&&!(await navigator.storage.persisted())) await navigator.storage.persist(); }catch(e){}
})();
